[project]
name = "trelis-converse-recipes"
version = "0.1.0"
description = "Reference recipes built from the public Trelis Converse SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Trelis Research"}]
dependencies = [
  "converse-sdk>=0.11.0",
  "httpx>=0.28",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
# Text modality is pinned to the reviewed SDK implementation until 0.11.0 is released to PyPI.
converse-sdk = { git = "https://github.com/Trelis-LTD/voice-loop-pro.git", rev = "7764c1d44ab8f2f37f065137fb2b8bda82d2421d", subdirectory = "sdk/python" }

[project.scripts]
converse-guided = "converse_recipes.cli:guided_main"
converse-sim = "converse_recipes.cli:simulation_main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/converse_recipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
