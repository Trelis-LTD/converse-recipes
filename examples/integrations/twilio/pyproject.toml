[project]
name = "dialt-twilio-example"
version = "0.1.0"
description = "Inbound Twilio Media Streams reference bridge for Dialt."
requires-python = ">=3.11"
dependencies = [
    "dialt-sdk>=0.17.0",
    "fastapi>=0.115",
    "numpy>=1.26",
    "python-multipart>=0.0.18",
    "twilio>=9.4",
    "soxr>=1.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3"]
